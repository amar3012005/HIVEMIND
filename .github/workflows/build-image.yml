# NOW-tier deploy safety: build an IMMUTABLE image per commit, gated on tests.
# Replaces the fragile "git pull on the box + bind-mount" model. Every push to
# main produces ghcr.io/<repo>/hivemind-core:<sha> (+ :latest) ONLY if the unit
# tests + syntax check pass — so a broken commit never becomes a deployable tag.
# Rollback = redeploy a previous :<sha> tag (see docs/DEPLOY_RUNBOOK.md).
#
# `singulance-main` ADDED 2026-08-05. It is the ONLY deployable ref (CLAUDE.md) and it was
# MISSING from this list — so every release-worthy commit produced no image and the whole
# registry path silently no-opped. The box therefore had to build from a working tree,
# which is exactly what this workflow exists to prevent: on 2026-08-04 a stale
# `COPY core/src ./src` layer shipped an image with 53 files in src/memory instead of 61
# (canonical-entity-persister.js absent entirely), and the marker-grep PASSED because
# grepping a missing file returns nothing. CI building from a clean checkout removes that
# failure mode by construction.
#
# NOTE: this workflow cannot run at all until the GitHub Actions billing lock on the
# account is cleared. Jobs currently report `failure` with "The job was not started
# because your account is locked due to a billing issue" — indistinguishable from a real
# test failure unless you open the job. Until then, box-side builds remain the fallback
# and MUST use --no-cache when a change adds a file, plus a file-count check.
name: build-core-image

on:
  push:
    branches: [singulance-main, main, feat/mneme-foundation]
    paths:
      - 'core/**'
      - 'extensions/**'
      - 'Dockerfile.production'
      - '.github/workflows/build-image.yml'
  workflow_dispatch: {}

concurrency:
  group: build-core-image-${{ github.ref }}
  cancel-in-progress: false   # never cancel a build that may become a deploy tag

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/hivemind-core

jobs:
  # ── GATE: tests + syntax must pass before we build a deployable artifact ──
  test-gate:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: core/package-lock.json
      - name: Install deps
        working-directory: ./core
        run: npm ci
      - name: Syntax check (all src)
        working-directory: ./core
        run: find src -name "*.js" -exec node --check {} \;
      - name: Unit tests
        working-directory: ./core
        run: node --test tests/unit/ 2>&1 | tail -40

  # ── BUILD + PUSH immutable image, tagged by commit sha (and latest) ──
  build-push:
    name: Build & push image
    needs: test-gate          # no image unless the gate is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.production
          push: true
          build-args: |
            CACHE_BUST=${{ github.sha }}
            VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          echo "Pushed ${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploy with: IMAGE_TAG=${{ github.sha }} ./scripts/deploy.sh" >> $GITHUB_STEP_SUMMARY
