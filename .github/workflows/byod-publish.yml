name: BYOD setup-branch publish

# Fresh self-host installs clone the `byod` branch and build the agent from it.
# Its root must mirror byod/. Whenever byod/ changes on a source branch, auto-
# republish so the setup branch can never drift (the stale 322-line agent that
# almost shipped is the failure this prevents).
on:
  push:
    # singulance-main IS the deployable ref (CLAUDE.md: nothing deploys from a feature
    # branch). It was MISSING from this list, so every byod/ change merged there never
    # triggered a republish — which is precisely how the running self-host agent went 9 days
    # stale, without /v1/kb-lexical and without any document-scope enforcement, while the
    # embedded agent (which rides core deploys) had both.
    branches: [singulance-main, main, master, feat/mneme-foundation]
    paths:
      - 'byod/**'
      - 'scripts/stage-byod-bundle.sh'
      - 'scripts/storage-manifest.mjs'
      - 'scripts/storage-restore-drill.sh'
      - 'scripts/publish-byod.sh'
      - 'scripts/check-byod-sync.sh'
      - '.github/workflows/byod-publish.yml'
  workflow_dispatch: {}   # allow manual re-publish

permissions:
  contents: write          # GITHUB_TOKEN needs push access to the byod branch

concurrency:
  group: byod-publish      # never let two publishes race the branch
  cancel-in-progress: false

jobs:
  publish:
    name: Republish byod/ → byod branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + branch refs for the worktree/compare

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Republish (idempotent)
        run: bash scripts/publish-byod.sh

      - name: Verify byod branch now mirrors byod/
        run: bash scripts/check-byod-sync.sh
