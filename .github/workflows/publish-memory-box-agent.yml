name: publish-memory-box-agent

on:
  push:
    branches: [singulance-main]
    paths:
      - 'byod/agent/**'
      - 'byod/release-contract.mjs'
      - 'byod/sign-release.mjs'
      - '.github/workflows/publish-memory-box-agent.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-memory-box-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hivemind-hm-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent and release contract
        run: |
          node --check byod/agent/server.mjs
          node --check byod/release-contract.mjs
          node --test core/tests/storage/byod-release-contract.test.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable agent image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: byod/agent
          file: byod/agent/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=memory-box-agent
          cache-to: type=gha,mode=max,scope=memory-box-agent

      - name: Make customer agent package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /user/packages/container/hivemind-hm-agent/visibility \
            -f visibility=public

      - name: Record immutable digest
        run: |
          echo "Image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The production signing key must sign this exact digest before customer upgrade." >> "$GITHUB_STEP_SUMMARY"
