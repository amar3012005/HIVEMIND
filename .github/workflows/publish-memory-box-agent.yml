name: publish-memory-box-agent

on:
  push:
    branches: [singulance-main]
    paths:
      - 'byod/agent/**'
      - 'byod/release-contract.mjs'
      - 'byod/sign-release.mjs'
      - '.github/workflows/publish-memory-box-agent.yml'
  workflow_dispatch: {}

concurrency:
  group: publish-memory-box-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hivemind-hm-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent and release contract
        run: |
          node --check byod/agent/server.mjs
          node --check byod/release-contract.mjs
          node --test core/tests/storage/byod-release-contract.test.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable agent image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: byod/agent
          file: byod/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=memory-box-agent
          cache-to: type=gha,mode=max,scope=memory-box-agent

      - name: Log out and verify anonymous digest access
        run: |
          docker logout ghcr.io
          ANONYMOUS_DOCKER_CONFIG="$(mktemp -d)"
          DOCKER_CONFIG="$ANONYMOUS_DOCKER_CONFIG" \
            docker buildx imagetools inspect "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Record unsigned release candidate
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-candidate
          node -e '
            const fs = require("fs");
            const candidate = {
              schemaVersion: 1,
              sourceSha: process.env.GITHUB_SHA,
              image: `${process.env.IMAGE}@${process.env.IMAGE_DIGEST}`,
              digest: process.env.IMAGE_DIGEST,
              platforms: ["linux/amd64", "linux/arm64"],
              createdAt: new Date().toISOString(),
              signed: false
            };
            fs.writeFileSync("release-candidate/candidate.json", `${JSON.stringify(candidate, null, 2)}\n`);
          '
          echo "### Unsigned Memory Box agent candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "This exact digest must pass offline approval and signing before channel publication." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: memory-box-agent-candidate-${{ github.sha }}
          path: release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 90
