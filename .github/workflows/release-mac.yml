name: Release Mac App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Da-vinci submodule
        run: |
          git submodule update --init --recursive -- frontend/Da-vinci

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/Da-vinci/package-lock.json
            electron-app/package-lock.json

      - name: Install Da-vinci deps
        working-directory: frontend/Da-vinci
        run: npm ci --legacy-peer-deps

      - name: Build Da-vinci React app
        working-directory: frontend/Da-vinci
        env:
          REACT_APP_CONTROL_PLANE_URL: https://api.hivemind.davinciai.eu:8040
          REACT_APP_CORE_API_URL: https://core.hivemind.davinciai.eu:8050
          CI: false
        run: npm run build

      - name: Install electron-app deps
        working-directory: electron-app
        run: npm ci

      - name: Copy React build into electron-app
        run: |
          rm -rf electron-app/react-build
          cp -r frontend/Da-vinci/build electron-app/react-build

      - name: Build & package DMG (unsigned, no notarization)
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_PUBLISH: never
        run: npx electron-builder build --mac --publish=never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIVEMIND-mac-universal
          path: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
