name: Release Mac App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Da-vinci submodule
        run: |
          git submodule update --init --recursive -- frontend/Da-vinci

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/Da-vinci/package-lock.json
            electron-app/package-lock.json

      - name: Install Da-vinci deps
        working-directory: frontend/Da-vinci
        run: npm ci --legacy-peer-deps

      - name: Build Da-vinci React app
        working-directory: frontend/Da-vinci
        env:
          REACT_APP_CONTROL_PLANE_URL: https://api.singulancelabs.com
          REACT_APP_CORE_API_URL: https://core.singulancelabs.com
          REACT_APP_HIVEMIND_SITE_HOST: electron
          CI: false
        run: npm run build

      - name: Install electron-app deps
        working-directory: electron-app
        run: npm ci

      - name: Copy React build into electron-app
        run: |
          rm -rf electron-app/react-build
          cp -r frontend/Da-vinci/build electron-app/react-build

      - name: Build, sign, notarize & publish (signs only if Apple secrets present)
        working-directory: electron-app
        env:
          # Developer ID signing (base64 .p12 + password). If absent → unsigned build.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Notarization (afterSign hook skips when these are empty).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "→ signing + notarizing build"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            echo "→ UNSIGNED build (no MAC_CSC_LINK secret) — set Apple secrets for robust auto-update"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            npx electron-builder build --mac --publish always
          else
            npx electron-builder build --mac --publish never
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIVEMIND-mac-universal
          path: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
          if-no-files-found: error
        # NOTE: on tags, electron-builder (--publish always) creates the GitHub
        # release and uploads dmg/zip/latest-mac.yml itself — the canonical
        # electron-updater feed. No separate release step (avoids double-publish).
