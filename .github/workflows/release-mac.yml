# Legacy Electron rollback only. The customer DMG must pass the separate
# native signed/notarized release gate; do not publish this unsigned QA build.
name: Legacy Electron Mac QA — no distribution

on:
  workflow_dispatch:

jobs:
  rollback-qa:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Da-vinci submodule
        run: |
          git submodule update --init --recursive -- frontend/Da-vinci

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/Da-vinci/package-lock.json
            electron-app/package-lock.json

      - name: Install Da-vinci deps
        working-directory: frontend/Da-vinci
        run: npm ci --legacy-peer-deps

      - name: Build Da-vinci React app
        working-directory: frontend/Da-vinci
        env:
          REACT_APP_CONTROL_PLANE_URL: https://api.singulancelabs.com
          REACT_APP_CORE_API_URL: https://core.singulancelabs.com
          REACT_APP_HIVEMIND_SITE_HOST: electron
          CI: false
        run: npm run build

      - name: Install electron-app deps
        working-directory: electron-app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Copy React build into electron-app
        run: |
          rm -rf electron-app/react-build
          cp -r frontend/Da-vinci/build electron-app/react-build

      - name: Build native notch companion
        working-directory: electron-app
        run: npm run build:companion

      - name: Compile isolated Electron rollback app without an installer
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder build --mac --arm64 --dir --publish never
          echo 'QA build only: no signing, notarization, DMG, ZIP, artifact upload, or GitHub release.'
