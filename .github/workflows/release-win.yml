# Preserve the old Windows app as a QA rollback; customer distribution is
# limited to a separately signed/notarized native macOS DMG after release gates.
name: Legacy Windows QA — no distribution

on:
  workflow_dispatch:

jobs:
  rollback-qa:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install electron-app deps
        working-directory: electron-app
        run: npm ci

      - name: Compile Windows rollback app without an installer
        working-directory: electron-app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder build --win --x64 --dir --publish never
          echo 'QA build only: no installer, artifact upload, or GitHub release.'
