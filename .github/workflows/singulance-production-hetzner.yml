name: SINGULANCE production Hetzner

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Expected origin/singulance-main SHA (optional)
        required: false
        type: string
      services:
        description: Canonical quick-deploy service
        required: true
        type: string
      harness_image:
        description: Immutable Harness image digest when services includes harness-runner
        required: false
        type: string
      open_dot_image:
        description: Immutable Open Dot image digest when services includes open-dot
        required: false
        type: string
      open_dot_source_sha:
        description: 40-character Open Dot source commit when services includes open-dot
        required: false
        type: string
      requested_by:
        description: Who triggered the Cloudflare Workflow
        required: false
        type: string

concurrency:
  group: singulance-production-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    name: quick-deploy.sh singulance-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/singulance-main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singulance-main
      - name: Refuse anything except origin/singulance-main
        run: |
          git fetch origin singulance-main
          HEAD=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/singulance-main)
          echo "HEAD=$HEAD origin/singulance-main=$MAIN requested=${{ github.event.inputs.sha }}"
          test "$HEAD" = "$MAIN"
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            test "$HEAD" = "${{ github.event.inputs.sha }}"
          fi
      - name: SSH canonical release
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPEN_DOT_IMAGE: ${{ github.event.inputs.open_dot_image }}
          OPEN_DOT_SOURCE_SHA: ${{ github.event.inputs.open_dot_source_sha }}
        with:
          host: ${{ secrets.SINGULANCE_SSH_HOST }}
          username: ${{ secrets.SINGULANCE_SSH_USER }}
          key: ${{ secrets.SINGULANCE_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          envs: OPEN_DOT_IMAGE,OPEN_DOT_SOURCE_SHA
          script: |
            set -euo pipefail
            export RELEASE_SESSION_ID="gha-${{ github.run_id }}"
            export RELEASE_MIN_DISK_GB="${RELEASE_MIN_DISK_GB:-12}"
            if [ -n "${{ github.event.inputs.harness_image }}" ]; then
              export HIVEMIND_HARNESS_IMAGE="${{ github.event.inputs.harness_image }}"
            fi
            IFS=',' read -r -a services <<< "${{ github.event.inputs.services }}"
            /root/quick-deploy.sh singulance-main "${services[@]}"
      - name: Canary API
        run: curl -fsS -o /dev/null https://api.singulancelabs.com/health
