# HIVEMIND BYOD — DATA PLANE, runs on the CUSTOMER's box. Two parts, both on-box:
#   • hm-agent  — the PostgreSQL + Qdrant memory engine + an HTTP API the central
#                 engine POSTs finished memories to (/v1/write) and recalls from (/v1/recall).
#   • postgres  — local store the agent uses for content hydration (/v1/hydrate) so raw content stays on-box.
# NO engine/LLM here — the central engine does the canonical processing, then ships the finished memory
# to this agent. Memory data never leaves the box; only query results traverse the link.
#
# Exposure (pick one, set in .env):
#   • Direct HTTPS  — AGENT_PUBLIC_URL=https://agent.<your-domain>; put Caddy/your proxy in front for TLS.
#                     The AGENT_TOKEN + TLS secure it. Simplest; no tunnel.
#   • Tailscale     — set TS_AUTHKEY; central reaches the agent over the private tailnet. Enable the tunnel profile.
name: hivemind-byod

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: hm-byod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hivemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
    volumes:
      - ./data/pg:/var/lib/postgresql/data        # content hydration store — on the customer disk
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivemind} -d ${POSTGRES_DB:-hivemind}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local vector store. It is the authoritative vector index for this BYOD workspace.
  # Internal only (not published); only the agent talks to it over the compose network.
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
    container_name: hm-byod-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage             # vector backup persisted on the customer disk
    expose: ["6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    # Production installs must provide the digest-pinned image from the signed
    # release manifest. There is deliberately no build fallback here: a
    # customer box must never register a locally built, unsigned agent.
    image: ${HIVEMIND_AGENT_IMAGE:?signed HIVEMIND_AGENT_IMAGE is required}
    container_name: hm-byod-agent
    restart: unless-stopped
    environment:
      ORG_ID: ${HIVEMIND_ORG_ID}
      MNEME_DIM: ${EMBEDDING_DIMENSION:-1024}
      AGENT_RELEASE: ${VERSION:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hivemind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hivemind}?schema=hivemind
      QDRANT_URL: http://qdrant:6333               # local authoritative vector index
      AGENT_PORT: "8787"
      AGENT_TOKEN: ${AGENT_TOKEN}                   # bearer the central engine must present
    ports:
      - "${AGENT_BIND:-0.0.0.0}:${AGENT_PORT:-8787}:8787"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  # Optional private transport (alternative to direct HTTPS). Enable with: --profile tailnet
  tunnel:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    container_name: hm-byod-tunnel
    restart: unless-stopped
    profiles: ["tailnet"]
    hostname: ${TS_HOSTNAME:-hivemind-byod}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --advertise-tags=tag:hivemind-byod
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ./data/ts:/var/lib/tailscale
    cap_add: [NET_ADMIN, SYS_MODULE]
    depends_on: [agent]
