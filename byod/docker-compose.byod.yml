# HIVEMIND BYOD — DATA-ONLY, runs on the CUSTOMER's box. Just the stores that hold their memory data
# (Postgres + Qdrant) + an outbound tunnel. NO engine here — the engine, control, dashboard all stay
# central. HIVEMIND's core reaches these two stores through the tunnel for this org only. Customer
# memory never leaves the box; only query results traverse the encrypted link.
name: hivemind-byod-data

services:
  postgres:
    image: hivemind/postgres-age:15-age-custom   # PG15 + Apache AGE (same as central) — or postgres:16-alpine
    container_name: hm-byod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hivemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
    volumes:
      - ./data/pg:/var/lib/postgresql/data       # the memory subgraph lives HERE on the customer disk
    expose: ["5432"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: hm-byod-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./data/qdrant:/qdrant/storage            # the vectors live HERE
    expose: ["6333"]

  # Outbound tunnel — exposes Postgres + Qdrant to HIVEMIND central with NO inbound port.
  # Recommended: Tailscale (WireGuard, E2E, raw TCP for Postgres). cloudflared works for the Qdrant
  # HTTP port; Postgres (raw TCP) needs Tailscale or `cloudflared access tcp`. Pick per your network.
  tunnel:
    image: tailscale/tailscale:latest
    container_name: hm-byod-tunnel
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-hivemind-byod}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}                 # your Tailscale auth key (so central can reach pg/qdrant)
      TS_EXTRA_ARGS: --advertise-tags=tag:hivemind-byod
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - ./data/ts:/var/lib/tailscale
    cap_add: [NET_ADMIN, SYS_MODULE]
    depends_on: [postgres, qdrant]
