name: hivemind-byod-hyperagent

# Local E2E only. Attaches to the existing local HIVEMIND compose network
# (postgres + redis). Does not enroll Memory Box, does not touch production.

networks:
  hivemind-network:
    external: true

services:
  harness:
    build:
      context: .
      dockerfile: Dockerfile.hyperagent
      args:
        HARNESS_BASE: ${HIVEMIND_HARNESS_IMAGE:-hivemind/harness-chat:c874825a6f57e38c073f53b5f9da88c93403ff2c}
    image: hivemind/harness-chat:byod-hyperagent
    container_name: hm-byod-harness
    restart: unless-stopped
    read_only: true
    environment:
      NODE_ENV: production
      PORT: "3080"
      DSH_HOME: /tmp/dsh
      DSH_WORKSPACE: /data/fs
      DATABASE_URL: ${HARNESS_DATABASE_URL:-postgresql://hivemind:hivemind_dev_password@postgres:5432/hivemind_app}
      PGOPTIONS: -c search_path=hivemind,public
      REDIS_URL: ${HARNESS_REDIS_URL:-redis://redis:6379/0}
      HIVE_HARNESS_TICKET_SECRET: ${HIVE_HARNESS_TICKET_SECRET:?set a local ticket secret}
      HIVE_HARNESS_RUNNER_SERVICE_SECRET: ${HIVE_HARNESS_RUNNER_SERVICE_SECRET:?set a local runner secret}
      HIVEMIND_CONTROL_PLANE_URL: ${HIVEMIND_CENTRAL_URL:-https://preview-api.singulancelabs.com}
      HIVEMIND_SERVICE_HTTP_ORIGINS: ${HIVEMIND_CENTRAL_URL:-https://preview-api.singulancelabs.com}
      HIVEMIND_PARENT_ORIGINS: ${HIVEMIND_HARNESS_PARENT_ORIGINS:-http://localhost:13080}
      HIVEMIND_HARNESS_TRUSTED_HOSTS: ${HIVEMIND_HARNESS_TRUSTED_HOSTS:-localhost}
      HIVEMIND_ORG_ID: ${HIVEMIND_ORG_ID:-}
    volumes:
      - ./data/fs:/data/fs
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "${HARNESS_BIND:-127.0.0.1}:${HARNESS_PORT:-13080}:3080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [hivemind-network]
