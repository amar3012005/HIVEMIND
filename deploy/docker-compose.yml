services:
  open-design:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
        VERSION: ${VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        CACHE_BUST: ${CACHE_BUST:-1}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${OPEN_DESIGN_PORT:-3000}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-${APP_DATABASE_URL:-}}
      REDIS_URL: ${REDIS_URL:-${APP_REDIS_URL:-}}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      HIVEMIND_API_KEY: ${HIVEMIND_API_KEY:-}
      OD_ALLOWED_ORIGINS: ${OD_ALLOWED_ORIGINS:-*}
      OD_SESSION_SECRET: ${OD_SESSION_SECRET:-change-me}
      OD_COOKIE_INSECURE: ${OD_COOKIE_INSECURE:-false}
      OD_SIGNUP_ENABLED: ${OD_SIGNUP_ENABLED:-false}
      APP_ENV: ${APP_ENV:-production}
    expose:
      - "${OPEN_DESIGN_PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${OPEN_DESIGN_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
