services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
            args:
                NODE_ENV: production
                VERSION: '${VERSION:-2.0.0}'
                BUILD_DATE: '${BUILD_DATE:-unknown}'
                CACHE_BUST: '${CACHE_BUST:-20260323}'
        image: 'hivemind/core-api:${VERSION:-latest}'
        container_name: app-s0k0s0k40wo44w4w8gcs8ow0-125656582242
        hostname: hivemind-api
        restart: unless-stopped
        # security_opt:
            # - 'no-new-privileges:true'
        # cap_drop:
            # - ALL
        cap_add:
            - NET_BIND_SERVICE
        read_only: false
        # user: '1001:1001'
        deploy:
            resources:
                limits:
                    cpus: '2'
                    memory: 2G
                reservations:
                    cpus: '0.5'
                    memory: 512M
            restart_policy:
                condition: on-failure
                delay: 5s
                max_attempts: 3
                window: 120s
        environment:
            NODE_ENV: production
            HIVEMIND_RUNTIME_ROLE: app
            HIVEMIND_REQUIRE_QUEUED_KB_UPLOADS: 'true'
            PORT: '3000'
            HOST: 0.0.0.0
            VERSION: '${VERSION:-2.0.0}'
            HIVEMIND_API_URL: '${HIVEMIND_API_URL:-https://core.hivemind.davinciai.eu:8050}'
            HIVEMIND_CORE_API_BASE_URL: '${HIVEMIND_CORE_API_BASE_URL:-https://core.hivemind.davinciai.eu:8050}'
            HIVEMIND_CONTROL_PLANE_PUBLIC_URL: '${HIVEMIND_CONTROL_PLANE_PUBLIC_URL:-https://api.hivemind.davinciai.eu:8040}'
            HIVEMIND_ALLOWED_ORIGINS: '${HIVEMIND_ALLOWED_ORIGINS:-https://hivemind.davinciai.eu}'
            HIVEMIND_CONTROL_PLANE_ALLOWED_ORIGINS: '${HIVEMIND_CONTROL_PLANE_ALLOWED_ORIGINS:-https://hivemind.davinciai.eu}'
            HIVEMIND_CONTROL_PLANE_SESSION_SECRET: '${HIVEMIND_CONTROL_PLANE_SESSION_SECRET}'
            ZITADEL_ISSUER_URL: '${ZITADEL_ISSUER_URL}'
            ZITADEL_CLIENT_ID: '${ZITADEL_CLIENT_ID}'
            ZITADEL_CLIENT_SECRET: '${ZITADEL_CLIENT_SECRET}'
            ZITADEL_REDIRECT_URI: '${ZITADEL_REDIRECT_URI}'
            DATABASE_URL: 'postgresql://${POSTGRES_USER:-hivemind_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hivemind}?schema=public&connection_limit=20&pool_timeout=30'
            DATABASE_HOST: postgres
            DATABASE_PORT: '5432'
            DATABASE_NAME: '${POSTGRES_DB:-hivemind}'
            DATABASE_USER: '${POSTGRES_USER:-hivemind_user}'
            DATABASE_PASSWORD: '${POSTGRES_PASSWORD}'
            QDRANT_URL: 'http://qdrant:6333'
            QDRANT_API_KEY: '${QDRANT_API_KEY}'
            QDRANT_COLLECTION: '${QDRANT_COLLECTION:-hivemind_memories}'
            REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379/0'
            REDIS_HOST: redis
            REDIS_PORT: '6379'
            REDIS_HOST_FALLBACKS: '${REDIS_HOST_FALLBACKS:-redis-s0k0s0k40wo44w4w8gcs8ow0-223235365936,hivemind-redis}'
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
            GROQ_API_KEY: '${GROQ_API_KEY}'
            GROQ_INFERENCE_MODEL: '${GROQ_INFERENCE_MODEL:-openai/gpt-oss-20b}'
            MISTRAL_API_KEY: '${MISTRAL_API_KEY}'
            MISTRAL_EMBEDDING_MODEL: '${MISTRAL_EMBEDDING_MODEL:-mistral-embed}'
            API_MASTER_KEY: '${API_MASTER_KEY}'
            SESSION_SECRET: '${SESSION_SECRET}'
            HIVEMIND_MASTER_API_KEY: '${HIVEMIND_MASTER_API_KEY}'
            HIVEMIND_ADMIN_SECRET: '${HIVEMIND_ADMIN_SECRET}'
            CARTESIA_API_KEY: '${CARTESIA_API_KEY}'
            CARTESIA_AGENT_ID: '${CARTESIA_AGENT_ID}'
            USE_SITUATIONALIZER: '${USE_SITUATIONALIZER:-true}'
            USE_CONTEXTUAL_EMBEDDING: '${USE_CONTEXTUAL_EMBEDDING:-true}'
            USE_QDRANT_STORAGE: '${USE_QDRANT_STORAGE:-true}'
            USE_AST_CHUNKING: '${USE_AST_CHUNKING:-true}'
            USE_STATEFUL_MANAGER: '${USE_STATEFUL_MANAGER:-true}'
