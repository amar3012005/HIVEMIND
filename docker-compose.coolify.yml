            LOG_LEVEL: '${LOG_LEVEL:-info}'
            LOG_FORMAT: '${LOG_FORMAT:-json}'
            RATE_LIMIT_WINDOW_MS: '${RATE_LIMIT_WINDOW_MS:-60000}'
            RATE_LIMIT_MAX_REQUESTS: '${RATE_LIMIT_MAX_REQUESTS:-100}'
            # Phase 4 — Governance + cognitive layer ownership.
            # Hard-coded: governance now owns synthesis. Override via env to reverse.
            ENABLE_COGNITION_LOOP: 'false'
            ENABLE_GOVERNANCE_SCHEDULER: 'true'
            GOVERNANCE_INTERVAL_MS: '${GOVERNANCE_INTERVAL_MS:-14400000}'
            # Cognitive-tool LLM models (used by canonical + bridge tools).
            SYNTHESIS_MODEL: '${SYNTHESIS_MODEL:-openai/gpt-oss-20b}'
            SYNTHESIS_FALLBACK_MODEL: '${SYNTHESIS_FALLBACK_MODEL:-openai/gpt-oss-20b}'
