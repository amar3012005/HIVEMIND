            CANONICAL_CONFIDENCE_FLOOR: '${CANONICAL_CONFIDENCE_FLOOR:-0.7}'
            CANONICAL_COOLDOWN_HOURS: '${CANONICAL_COOLDOWN_HOURS:-6}'
            BRIDGE_CONFIDENCE_FLOOR: '${BRIDGE_CONFIDENCE_FLOOR:-0.7}'
            BRIDGE_COOLDOWN_HOURS: '${BRIDGE_COOLDOWN_HOURS:-12}'
            COMPRESSION_MIN_MEMBERS: '${COMPRESSION_MIN_MEMBERS:-3}'
            COMPRESSION_COOLDOWN_HOURS: '${COMPRESSION_COOLDOWN_HOURS:-12}'
            # Phase 4 — Tenant guard STRICT. Relational FK keys now recognised
            # so existing recall paths pass without code change.
            MEMORY_TENANT_STRICT: 'true'
            # Phase 4 — Per-org rate limit. Redis-backed when REDIS_HOST present.
            RATE_LIMIT_RPM_PER_ORG: '${RATE_LIMIT_RPM_PER_ORG:-120}'
            RATE_LIMIT_BURST_X: '${RATE_LIMIT_BURST_X:-2}'
            RATE_LIMIT_BACKEND: '${RATE_LIMIT_BACKEND:-auto}'
            # Phase 4 — Governance per-agent daily token budget heuristic
            GOV_FALLBACK_TOKENS_PER_RUN: '${GOV_FALLBACK_TOKENS_PER_RUN:-5000}'
            CONNECTOR_STALE_MS: '${CONNECTOR_STALE_MS:-86400000}'
            EU_REGION: '${EU_REGION:-eu-central-1}'
            DATA_RESIDENCY: EU
            GDPR_MODE: 'true'
            SENTRY_DSN: '${SENTRY_DSN:-}'
            SENTRY_ENVIRONMENT: '${SENTRY_ENVIRONMENT:-production}'
            BUILD_DATE: '${BUILD_DATE:-unknown}'
            NANGO_URL: 'http://nango:3003'
            NANGO_SECRET_KEY: '${NANGO_SECRET_KEY}'
            NANGO_WEBHOOK_SECRET: '${NANGO_WEBHOOK_SECRET:-8c78854b-f4b5-41a3-8a33-cfc70d757ed4}'
