# Local-only extension for the complete Singulance backend.
# Run with the base stack:
#   docker compose -f docker-compose.local-stack.yml -f docker-compose.local-services.yml up -d --build
#
# It deliberately uses only local Postgres, Qdrant, Redis, and local development
# credentials. No production database, API keys, Slack credentials, or services are used.

services:
  control-plane:
    image: hivemind-control-plane-local:latest
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    container_name: hivemind-control-plane-local
    env_file:
      - path: ${HIVEMIND_CORE_ENV_FILE:-./core/.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hivemind:hivemind_dev_password@postgres:5432/hivemind_app?schema=hivemind
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: dev_api_key_hivemind_2026
      QDRANT_COLLECTION: hivemind_memories
      REDIS_URL: redis://redis:6379/0
      HIVEMIND_CORE_API_BASE_URL: http://hivemind-api:3000
      HIVEMIND_API_URL: http://hivemind-api:3000
      HIVEMIND_EMPLOYEES_URL: http://employees:8060
      EMPLOYEES_SIDECAR_URL: http://employees:8060
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:3000
      HIVEMIND_CORE_API_PUBLIC_URL: https://preview.singulancelabs.com
      HIVEMIND_CONTROL_PLANE_PUBLIC_URL: https://preview-api.singulancelabs.com
      HIVEMIND_FRONTEND_URL: https://next.preview.singulancelabs.com
      HIVEMIND_CONTROL_PLANE_POST_LOGIN_REDIRECT: https://next.preview.singulancelabs.com/hivemind/app/overview
      HIVEMIND_LOCAL_MODE: "true"
      HIVEMIND_LOCAL_AUTH_BYPASS: "true"
      EMAIL_IDENTITY_V1_ENABLED: "true"
      EMAIL_IDENTITY_V1_MODE: email_only
      EMAIL_AUTH_ALLOWED_ORIGINS: https://next.preview.singulancelabs.com
      EMAIL_AUTH_ENCRYPTION_KEY: ${HIVEMIND_OAUTH_SESSION_SECRET:-local-oauth-session}-email-auth-encryption-v1
      EMAIL_AUTH_TOKEN_SECRET: ${SESSION_SECRET:-local-session}-email-auth-token-v1
      # Official Cloudflare always-pass test widget; local/preview only.
      TURNSTILE_EMAIL_AUTH_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_EMAIL_AUTH_SECRET: 1x0000000000000000000000000000000AA
      EMAIL_AUTH_TURNSTILE_BYPASS: "true"
      AUTH_EMAIL_FLAG_URL: ${AUTH_EMAIL_FLAG_URL:-https://singulance-auth-email-local.amarsai2005.workers.dev}
      AUTH_EMAIL_QUEUE_URL: ${AUTH_EMAIL_QUEUE_URL:-https://singulance-auth-email-local.amarsai2005.workers.dev}
      AUTH_EMAIL_QUEUE_SECRET: ${HIVEMIND_PREVIEW_EMAIL_GATEWAY_TOKEN:-}
      ZITADEL_API_URL: ${ZITADEL_PREVIEW_API_URL:-}
      ZITADEL_SERVICE_PAT: ${ZITADEL_PREVIEW_SERVICE_PAT:-}
      ZITADEL_EMAIL_ORG_ID: ${ZITADEL_PREVIEW_EMAIL_ORG_ID:-}
      KNOWLEDGE_INGEST_WORKFLOW_ENABLED: ${KNOWLEDGE_INGEST_WORKFLOW_ENABLED:-false}
      KNOWLEDGE_INGEST_WORKFLOW_SECRET: ${KNOWLEDGE_INGEST_WORKFLOW_SECRET:-}
      HYPER_GROK_RUNTIME_ENABLED: ${HYPER_GROK_RUNTIME_ENABLED:-false}
      HYPER_GROK_RUNTIME_ENVIRONMENT: local
      HYPER_GROK_WORKFLOW_URL: ${HYPER_GROK_WORKFLOW_URL:-http://host.docker.internal:8789}
      HYPER_GROK_WORKFLOW_SECRET: ${HYPER_GROK_WORKFLOW_SECRET:-}
      # Cloudflare Worker gateway: credentials stay in the local Docker
      # environment and the Worker accepts only the explicit preview allowlist.
      HIVEMIND_PREVIEW_EMAIL_GATEWAY_URL: https://singulance-preview-mailer.amarsai2005.workers.dev
      HIVEMIND_PREVIEW_EMAIL_GATEWAY_TOKEN: ${HIVEMIND_PREVIEW_EMAIL_GATEWAY_TOKEN:-}
      HIVEMIND_LOCAL_PREVIEW_EMAIL_ALLOWLIST: ${HIVEMIND_LOCAL_PREVIEW_EMAIL_ALLOWLIST:-}
      HIVEMIND_ALLOWED_ORIGINS: https://next.preview.singulancelabs.com
      HIVEMIND_CONTROL_PLANE_ALLOWED_ORIGINS: https://next.preview.singulancelabs.com
      HIVEMIND_MASTER_API_KEY: ${HIVEMIND_MASTER_API_KEY:-hm_master_key_99228811}
      HIVEMIND_ADMIN_SECRET: ${HIVEMIND_ADMIN_SECRET:-local-admin-secret-change-me}
      HIVEMIND_PLATFORM_ADMIN_PASSCODE: ${HIVEMIND_PLATFORM_ADMIN_PASSCODE:-local-platform-admin-passcode-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me}
      API_MASTER_KEY: ${API_MASTER_KEY:-local-api-master-key-change-me}
      # Prevent local employee/config activity from using external provider credentials.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_BASE_URL: ${CLOUDFLARE_AI_GATEWAY_BASE_URL:-https://gateway.ai.cloudflare.com}
      CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
      SLACK_CLIENT_ID: ""
      SLACK_CLIENT_SECRET: ""
    ports:
      - "3001:3000"
    volumes:
      # Local development uses the checked-out control plane directly. This
      # avoids a full image rebuild for each route-only iteration.
      - ./core/src:/app/src:ro
    networks:
      - hivemind-network
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  employees:
    image: hivemind-employees-local:latest
    build:
      context: ./employees-service
      dockerfile: Dockerfile
    container_name: hivemind-employees-local
    environment:
      PORT: 8060
      LOG_LEVEL: info
      REPLICA_ID: local-1
      REPLICA_COUNT: 1
      HIVEMIND_CORE_URL: http://api:3000
      HIVEMIND_CP_URL: http://control-plane:3000
      HIVEMIND_PUBLIC_CORE_URL: https://preview.singulancelabs.com
      HIVEMIND_PUBLIC_CP_URL: https://preview-api.singulancelabs.com
      DATABASE_URL: postgresql://hivemind:hivemind_dev_password@postgres:5432/hivemind_app?schema=hivemind
      REDIS_URL: redis://redis:6379/0
      HIVEMIND_MASTER_API_KEY: ${HIVEMIND_MASTER_API_KEY:-hm_master_key_99228811}
      HYPER_GROK_WORKFLOW_URL: ${HYPER_GROK_WORKFLOW_URL:-}
      HYPER_GROK_WORKFLOW_SECRET: ${HYPER_GROK_WORKFLOW_SECRET:-}
      # Keep local HyperAgent cognition on the same provider/model policy as
      # production while all semantic and lifecycle data remains local. These
      # are pass-throughs only; values are never committed to Compose.
      HYPER_MODEL_BEST: ${HYPER_MODEL_BEST:-}
      HYPER_MODEL_RECON: ${HYPER_MODEL_RECON:-}
      HYPER_ROOM_MODEL: ${HYPER_ROOM_MODEL:-}
      HYPER_SYNTH_MODEL: ${HYPER_SYNTH_MODEL:-}
      HIVEMIND_AGENT_FINAL_MODEL: ${HIVEMIND_AGENT_FINAL_MODEL:-}
      HIVEMIND_LLM_MODEL: ${HIVEMIND_LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PRIMARY: ${LLM_PRIMARY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      # Artifact-only Room profiles (branding, marketing, fundraising, product)
      # must be able to enter the governed renderer in the shared local preview.
      VISUAL_PATH_IN_HYPERROOMS: ${VISUAL_PATH_IN_HYPERROOMS:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_BASE_URL: ${CLOUDFLARE_AI_GATEWAY_BASE_URL:-https://gateway.ai.cloudflare.com}
      CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
      SLACK_CLIENT_ID: ""
      SLACK_CLIENT_SECRET: ""
    ports:
      - "8060:8060"
    volumes:
      - ./employees-service/src:/app/src:ro
    networks:
      - hivemind-network
    depends_on:
      api:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8060/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
