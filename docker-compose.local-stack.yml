# HIVE-MIND - Complete Local Stack
# PostgreSQL + Apache AGE + Qdrant + Embedding Model
# 
# Usage:
#   docker-compose -f docker-compose.local-stack.yml up -d
#   node scripts/setup-qdrant.js

services:
  api:
    build:
      context: .
      dockerfile: core/Dockerfile.dev
    container_name: hivemind-api
    env_file:
      - path: ${HIVEMIND_CORE_ENV_FILE:-./core/.env}
        required: false
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://hivemind:hivemind_dev_password@postgres:5432/hivemind_app?schema=hivemind
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: dev_api_key_hivemind_2026
      QDRANT_COLLECTION: hivemind_memories
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_INFERENCE_MODEL: ${GROQ_INFERENCE_MODEL:-llama-3.3-70b-versatile}
      GROQ_API_TIMEOUT: ${GROQ_API_TIMEOUT:-}
      GROQ_BASE_PROMPT: ${GROQ_BASE_PROMPT:-}
      GROQ_LANGUAGE: ${GROQ_LANGUAGE:-}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL:-mistral-embed}
      # Production-parity AI transport. Values are injected into the local
      # process environment by the operator; none are committed to this file.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_BASE_URL: ${CLOUDFLARE_AI_GATEWAY_BASE_URL:-https://gateway.ai.cloudflare.com}
      CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_BLAIQ_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_BLAIQ_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_BGE_EMBEDDINGS_PROVIDER: ${CLOUDFLARE_AI_GATEWAY_BGE_EMBEDDINGS_PROVIDER:-}
      CLOUDFLARE_AI_GATEWAY_BGE_RERANKER_PROVIDER: ${CLOUDFLARE_AI_GATEWAY_BGE_RERANKER_PROVIDER:-}
      CLOUDFLARE_AI_GATEWAY_BLAIQ_PROVIDER: ${CLOUDFLARE_AI_GATEWAY_BLAIQ_PROVIDER:-}
      CLOUDFLARE_AI_GATEWAY_QWEN_INGEST_PROVIDER: ${CLOUDFLARE_AI_GATEWAY_QWEN_INGEST_PROVIDER:-}
      CLOUDFLARE_AI_GATEWAY_TEXT_ROUTE: ${CLOUDFLARE_AI_GATEWAY_TEXT_ROUTE:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_FALLBACK_PROVIDER: ${EMBEDDING_FALLBACK_PROVIDER:-}
      EMBEDDING_FALLBACK2_PROVIDER: ${EMBEDDING_FALLBACK2_PROVIDER:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-}
      SINGULANCE_EMBED_API_KEY: ${SINGULANCE_EMBED_API_KEY:-}
      SINGULANCE_EMBED_BASE_URL: ${SINGULANCE_EMBED_BASE_URL:-}
      SINGULANCE_EMBED_MODEL: ${SINGULANCE_EMBED_MODEL:-}
      BLAIQ_EMBED_API_KEY: ${BLAIQ_EMBED_API_KEY:-}
      BLAIQ_EMBED_BASE_URL: ${BLAIQ_EMBED_BASE_URL:-}
      BLAIQ_EMBED_MODEL: ${BLAIQ_EMBED_MODEL:-}
      BLAIQ_EMBED_TIMEOUT_MS: ${BLAIQ_EMBED_TIMEOUT_MS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_EMBED_MODEL: ${OPENROUTER_EMBED_MODEL:-}
      OPENROUTER_EMBED_TIMEOUT_MS: ${OPENROUTER_EMBED_TIMEOUT_MS:-}
      # Chat extraction uses the same production models and Cloudflare AI
      # Gateway, but must select the OpenRouter chat provider. Without this
      # explicit route a shared LITELLM_BASE_URL can point chat traffic at the
      # custom BGE embeddings provider and return opaque Gateway 530s.
      LLM_PRIMARY: ${LLM_PRIMARY:-openrouter}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_EMBED_MODEL: ${LITELLM_EMBED_MODEL:-}
      EMBEDDINGS_SERVICE_URL: ${EMBEDDINGS_SERVICE_URL:-}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      KB_UNIFIED_EXTRACT: ${KB_UNIFIED_EXTRACT:-true}
      KB_UNIFIED_MODEL: ${KB_UNIFIED_MODEL:-}
      KB_UNIFIED_FALLBACK_MODELS: ${KB_UNIFIED_FALLBACK_MODELS:-}
      KB_CURATOR_MODEL: ${KB_CURATOR_MODEL:-}
      MEMORY_PROCESSOR_MODEL: ${MEMORY_PROCESSOR_MODEL:-}
      ENTITY_EXTRACTION_MODEL: ${ENTITY_EXTRACTION_MODEL:-}
      CLAIM_STRUCTURING_MODEL: ${CLAIM_STRUCTURING_MODEL:-}
      KB_ALLOW_PER_FACT_LLM_LINKING: ${KB_ALLOW_PER_FACT_LLM_LINKING:-}
      KB_CONSOLIDATE: ${KB_CONSOLIDATE:-}
      KB_CURATED_MEMORY_CAP: ${KB_CURATED_MEMORY_CAP:-}
      KB_DISTILL_WINDOW_CHARS: ${KB_DISTILL_WINDOW_CHARS:-}
      KB_ENABLE_ALGO_VERSION_EDGES: ${KB_ENABLE_ALGO_VERSION_EDGES:-}
      KB_ENRICH_ENABLED: ${KB_ENRICH_ENABLED:-}
      KB_ENTITY_LINK_MODE: ${KB_ENTITY_LINK_MODE:-}
      KB_FACTS_PER_1K_CHARS: ${KB_FACTS_PER_1K_CHARS:-}
      KB_INGEST_VERBOSE: ${KB_INGEST_VERBOSE:-}
      KB_MIN_FACTS_PER_WINDOW: ${KB_MIN_FACTS_PER_WINDOW:-}
      KB_SEGMENT_WRITE_ATTEMPTS: ${KB_SEGMENT_WRITE_ATTEMPTS:-}
      KB_UNIFIED_EMPTY_RETRIES: ${KB_UNIFIED_EMPTY_RETRIES:-}
      KB_UNIFIED_WINDOW_CHARS: ${KB_UNIFIED_WINDOW_CHARS:-}
      HIVEMIND_MASTER_API_KEY: ${HIVEMIND_MASTER_API_KEY:-hm_master_key_99228811}
      HIVEMIND_ADMIN_SECRET: ${HIVEMIND_ADMIN_SECRET:-local-admin-secret-change-me}
      HIVEMIND_OAUTH_SESSION_SECRET: ${HIVEMIND_OAUTH_SESSION_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Durable Knowledge Base ingestion is opt-in and local-only. The core
      # still requires a positive Flagship decision for the organization.
      HIVEMIND_LOCAL_MODE: "true"
      KNOWLEDGE_INGEST_WORKFLOW_ENABLED: ${KNOWLEDGE_INGEST_WORKFLOW_ENABLED:-false}
      KNOWLEDGE_INGEST_WORKFLOW_URL: ${KNOWLEDGE_INGEST_WORKFLOW_URL:-http://host.docker.internal:8788}
      KNOWLEDGE_INGEST_WORKFLOW_SECRET: ${KNOWLEDGE_INGEST_WORKFLOW_SECRET:-}
      # Phase 0 canonical claim projection remains fail-closed unless both the
      # environment switch and tenant/user Flagship variation allow it.
      CANONICAL_KNOWLEDGE_ENABLED: ${CANONICAL_KNOWLEDGE_ENABLED:-false}
      CANONICAL_KNOWLEDGE_KILL_SWITCH: ${CANONICAL_KNOWLEDGE_KILL_SWITCH:-false}
      CANONICAL_PROJECTION_WORKFLOW_URL: ${CANONICAL_PROJECTION_WORKFLOW_URL:-http://host.docker.internal:8787}
      CANONICAL_PROJECTION_WORKFLOW_SECRET: ${CANONICAL_PROJECTION_WORKFLOW_SECRET:-}
      CANONICAL_PROJECTION_HMAC_SECRET: ${CANONICAL_PROJECTION_HMAC_SECRET:-}
      RECALL_PARALLEL_RELIABILITY_ENABLED: ${RECALL_PARALLEL_RELIABILITY_ENABLED:-false}
      # Chat V2 remains authoritative. This additive envelope is enabled only
      # when both the local master switch and Flagship mode are positive.
      # Cloudflare receives lifecycle metadata only; Core PostgreSQL retains
      # messages, recall packets, tool results, citations, and responses.
      DURABLE_CHAT_AGENT_ENABLED: ${DURABLE_CHAT_AGENT_ENABLED:-false}
      CLOUDFLARE_CHAT_AGENT_URL: ${CLOUDFLARE_CHAT_AGENT_URL:-}
      CLOUDFLARE_CHAT_AGENT_SECRET: ${CLOUDFLARE_CHAT_AGENT_SECRET:-}
      HYPER_GROK_RUNTIME_ENABLED: ${HYPER_GROK_RUNTIME_ENABLED:-false}
      HYPER_GROK_RUNTIME_ENVIRONMENT: local
      HYPER_GROK_WORKFLOW_URL: ${HYPER_GROK_WORKFLOW_URL:-http://host.docker.internal:8789}
      HYPER_GROK_WORKFLOW_SECRET: ${HYPER_GROK_WORKFLOW_SECRET:-}
      ENABLE_DOCUMENT_FIRST_INGEST: ${ENABLE_DOCUMENT_FIRST_INGEST:-true}
      ENABLE_EVIDENCE_RECALL: ${ENABLE_EVIDENCE_RECALL:-true}
      ENABLE_ENTITY_EXTRACTION: ${ENABLE_ENTITY_EXTRACTION:-true}
      USE_SITUATIONALIZER: ${USE_SITUATIONALIZER:-true}
      USE_CONTEXTUAL_EMBEDDING: ${USE_CONTEXTUAL_EMBEDDING:-true}
      USE_QDRANT_STORAGE: ${USE_QDRANT_STORAGE:-true}
      USE_AST_CHUNKING: ${USE_AST_CHUNKING:-true}
      USE_STATEFUL_MANAGER: ${USE_STATEFUL_MANAGER:-true}
      # Durable Dreaming v2 local canary. The production branch and production
      # Worker remain untouched; the shared credential is supplied by the host.
      DREAM_WORKFLOW_V2_ENABLED: "true"
      HIVEMIND_DREAM_WORKER_URL: https://hivemind-dream-lifecycle-local.amarsai2005.workers.dev
      HIVEMIND_DREAM_WORKFLOW_SECRET: ${HIVEMIND_DREAM_WORKFLOW_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me}
      # hm-extract: OFF by default (KB_EXTRACT_URL unset in ./core/.env means this
      # whole tier is skipped, zero behavior change). Set KB_EXTRACT_URL in
      # core/.env to http://hm-extract:8088 to enable, narrow format allowlist
      # only — see core/src/knowledge/enterprise/hm-extract-adapter.js.
      KB_EXTRACT_URL: ${KB_EXTRACT_URL:-}
      KB_EXTRACT_FORMATS: ${KB_EXTRACT_FORMATS:-pptx,ppt,pptm,ppsx,ppsm,doc,docm,odt,rtf,epub}
    ports:
      - "3000:3000"
    volumes:
      - ./core/data:/app/data
      # Local feature work is source-mounted so ordinary JS changes need only a
      # fast container restart. Rebuild the image only when package manifests,
      # native dependencies, Prisma generation, or the Dockerfile changes.
      - ./core/src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hivemind-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
      docling:
        condition: service_healthy

  # ==========================================
  # hm-extract — standalone document extraction (anydoc-based)
  # Stateless, no tenant identity, no DB. See hm-extract/README.md and
  # .claude/decision-docs/HM_EXTRACT_PLAN.md for the full design and why.
  # Internal network only — never exposed via a published port in any
  # deploy profile (P2 of the rollout plan: dark, internal-only).
  # ==========================================
  hm-extract:
    build:
      context: ./hm-extract
    container_name: hivemind-hm-extract
    environment:
      UV_THREADPOOL_SIZE: 8
      # Sized per the real measurement in hm-extract/README.md's "Memory"
      # section: repeated large-document passes plateau around ~5.3GB, not
      # the earlier-assumed 2GB. 4g here is a local-dev floor, not the
      # verified production number (that still needs real x86 hardware).
    mem_limit: 4g
    # NO healthcheck override — the Dockerfile's own HEALTHCHECK
    # (node -e "fetch(...)") is correct. A wget-based override here made a
    # genuinely healthy container report unhealthy in production, because
    # node:22-slim has no wget — caught on the real first deploy.
    restart: unless-stopped
    networks:
      - hivemind-network

  # Production-parity PDF/document parser, pinned to the exact digest running
  # on the Singulance server. Source bytes and parser traffic remain local.
  docling:
    image: ghcr.io/docling-project/docling-serve@sha256:69f7c33dab7067be28d88bfe61b7be08e53c4f87d5571378001f853d9b95c34e
    container_name: hivemind-docling
    environment:
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 3
      OMP_NUM_THREADS: 2
      DOCLING_SERVE_MAX_SYNC_WAIT: 180
    mem_limit: 9g
    cpus: 3
    volumes:
      - docling_models:/opt/app-root/src/.cache/docling/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - hivemind-network

  # ==========================================
  # PostgreSQL 15 + Apache AGE
  # Using official PostgreSQL with AGE extension
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: hivemind-postgres
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind_dev_password
      POSTGRES_DB: hivemind_app
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-age.sql:/docker-entrypoint-initdb.d/01-install-age.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind -d hivemind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hivemind-network

  # ==========================================
  # Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: hivemind-qdrant
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
      - QDRANT__STORAGE__PERFORMANCE__CPU_COUNT=2
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__API_KEY=dev_api_key_hivemind_2026
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "9200:6333"  # HTTP API (mapped to 9200 to avoid conflict)
      - "9201:6334"  # gRPC
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':18BD' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - hivemind-network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: hivemind-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - hivemind-network

  # ==========================================
  # NO LOCAL EMBEDDING MODEL
  # Use Mistral AI API or Groq API for embeddings
  # BGE-M3 (1024-dim) via Mistral: mistral-embed
  # ==========================================
  # Embedding is done via API - no container needed!
  # Configure in .env: MISTRAL_API_KEY or GROQ_API_KEY

  # ==========================================
  # pgAdmin (Optional - for database UI)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:8.0
    container_name: hivemind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hivemind.example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - hivemind-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: hivemind-postgres-data
  qdrant_data:
    name: hivemind-qdrant-data
  embedding_cache:
    name: hivemind-embedding-cache
  pgadmin_data:
    name: hivemind-pgadmin-data
  docling_models:
    name: hivemind-docling-models

networks:
  hivemind-network:
    name: hivemind-network
    driver: bridge
