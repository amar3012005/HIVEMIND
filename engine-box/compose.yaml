name: hivemind-engine-box

x-engine-service: &engine-service
  restart: unless-stopped
  env_file: .env
  networks: [engine_internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    <<: *engine-service
    image: ${POSTGRES_IMAGE:?manifest must pin POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: hivemind
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    <<: *engine-service
    image: ${QDRANT_IMAGE:?manifest must pin QDRANT_IMAGE}
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:6333/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *engine-service
    image: ${REDIS_IMAGE:?manifest must pin REDIS_IMAGE}
    command: [sh, -ec, 'exec redis-server --requirepass "$(cat /run/secrets/redis_password)" --appendonly yes --save "60 1000"']
    volumes: [redis_data:/data]
    secrets: [redis_password]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$(cat /run/secrets/redis_password)" ping']
      interval: 10s
      timeout: 5s
      retries: 12

  hm-extract:
    <<: *engine-service
    image: ${HM_EXTRACT_IMAGE:?manifest must pin HM_EXTRACT_IMAGE}
    read_only: true
    tmpfs: [/tmp]

  hm-playwright:
    <<: *engine-service
    image: ${HM_PLAYWRIGHT_IMAGE:?manifest must pin HM_PLAYWRIGHT_IMAGE}
    read_only: true
    tmpfs: [/tmp]
    profiles: [browser]

  hm-model-router:
    <<: *engine-service
    image: ${HM_MODEL_ROUTER_IMAGE:?manifest must pin HM_MODEL_ROUTER_IMAGE}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./model-catalog.json:/etc/hivemind/model-catalog.json:ro
      - ./model-catalog.sig:/etc/hivemind/model-catalog.sig:ro
      - ./release.pub:/etc/hivemind/release.pub:ro
      - engine_state:/var/lib/hivemind-engine:ro
    environment:
      ENGINE_BOX_STATE_DIR: /var/lib/hivemind-engine/state
      ENGINE_BOX_STATE_KEY_FILE: /run/secrets/state_key
    secrets: [state_key]
    healthcheck:
      test: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  hm-core:
    <<: *engine-service
    image: ${HM_CORE_IMAGE:?manifest must pin HM_CORE_IMAGE}
    environment:
      ENGINE_BOX_MODE: 'true'
      ENGINE_BOX_SOVEREIGN: 'true'
      ENGINE_BOX_ENABLE: ingestion,recall,chat,mcp,temporal,graph
      HIVEMIND_RUNTIME_ROLE: app
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: hivemind
      QDRANT_URL: http://qdrant:6333
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      KB_QUEUE_MODE: all
      KB_EXTRACT_URL: http://hm-extract:8088
      MODEL_ROUTER_URL: http://hm-model-router:8090
      CONTROL_PLANE_URL: http://hm-control-plane:3001
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }
      hm-extract: { condition: service_healthy }
      hm-model-router: { condition: service_healthy }
    secrets: [postgres_password, redis_password]
    command: ["/usr/local/bin/hm-engine-entrypoint", "node", "src/engine-box/lean-server.mjs"]

  # This is deliberately a local Control Plane. It owns appliance identity,
  # RBAC, local API keys, local administration, and audit. Hosted onboarding,
  # connectors, employees, and workflow orchestration are not part of this
  # product mode and must not be imported by its entrypoint.
  hm-control-plane:
    <<: *engine-service
    image: ${HM_CONTROL_PLANE_IMAGE:?manifest must pin HM_CONTROL_PLANE_IMAGE}
    environment:
      ENGINE_BOX_MODE: 'true'
      ENGINE_BOX_ENABLE: identity,rbac,api_keys,licence,admin,audit
      HIVEMIND_RUNTIME_ROLE: control_plane
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: hivemind
      CORE_LOCAL_URL: http://hm-core:3000
      ENGINE_BOX_STATE_DIR: /var/lib/hivemind-engine/state
      ENGINE_BOX_SETUP_TOKEN_FILE: /run/secrets/setup_token
      ENGINE_BOX_STATE_KEY_FILE: /run/secrets/state_key
    depends_on:
      postgres: { condition: service_healthy }
      hm-core: { condition: service_started }
    volumes: [engine_state:/var/lib/hivemind-engine]
    secrets: [postgres_password, setup_token, state_key]
    command: ["/usr/local/bin/hm-engine-entrypoint", "node", "src/engine-box/control-plane-server.mjs"]

  hm-auth:
    <<: *engine-service
    image: ${OAUTH2_PROXY_IMAGE:?manifest must pin OAUTH2_PROXY_IMAGE}
    profiles: [identity]
    read_only: true
    tmpfs: [/tmp]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      # Compose evaluates interpolation for inactive profiles too. Keep the
      # first local boot independent of optional OIDC configuration; the
      # supervisor validates these fields before enabling this profile.
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${ENGINE_BOX_OIDC_ISSUER:-}
      OAUTH2_PROXY_CLIENT_ID: ${ENGINE_BOX_OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/oidc_cookie_secret
      OAUTH2_PROXY_REDIRECT_URL: ${ENGINE_BOX_OIDC_REDIRECT_URL:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    secrets: [oidc_client_secret, oidc_cookie_secret]

  hm-edge:
    <<: *engine-service
    image: ${CADDY_IMAGE:?manifest must pin CADDY_IMAGE}
    read_only: true
    tmpfs: [/config, /tmp]
    volumes:
      - ./edge/Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro
      - edge_data:/data
    depends_on:
      hm-core: { condition: service_started }
      redis: { condition: service_healthy }
      hm-extract: { condition: service_healthy }
      hm-model-router: { condition: service_healthy }
    ports: ["127.0.0.1:${ENGINE_BOX_CORE_PORT:-8787}:8787"]

  hm-ingestion:
    <<: *engine-service
    image: ${HM_INGESTION_IMAGE:?manifest must pin HM_INGESTION_IMAGE}
    environment:
      ENGINE_BOX_MODE: 'true'
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: hivemind
      QDRANT_URL: http://qdrant:6333
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      KB_QUEUE_MODE: all
      KB_EXTRACT_URL: http://hm-extract:8088
      MODEL_ROUTER_URL: http://hm-model-router:8090
    depends_on:
      hm-core: { condition: service_started }
    secrets: [postgres_password, redis_password]
    command: ["/usr/local/bin/hm-engine-entrypoint", "node", "src/workers/engine-box-ingestion-worker.mjs"]

  cloudflared:
    <<: *engine-service
    image: ${CLOUDFLARED_IMAGE:?manifest must pin CLOUDFLARED_IMAGE}
    # The supervisor renders the token as TUNNEL_TOKEN only after central
    # enrollment. Empty credentials keep this optional service stopped.
    command: [tunnel, --no-autoupdate, run, --token, "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    secrets: [cloudflare_tunnel_token]
    profiles: [cloudflare]

volumes:
  postgres_data: {}
  qdrant_data: {}
  redis_data: {}
  edge_data: {}
  engine_state: {}

networks:
  engine_internal:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  oidc_cookie_secret:
    file: ./secrets/oidc_cookie_secret
  redis_password:
    file: ./secrets/redis_password
  setup_token:
    file: ./secrets/setup_token
  state_key:
    file: ./secrets/state_key
