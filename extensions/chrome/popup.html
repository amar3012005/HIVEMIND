<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      background: #faf9f4;
      color: #0a0a0a;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid #ece9e2;
    }
    .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(17,125,255,0.08);
      border: 1px solid rgba(17,125,255,0.18);
      display: flex; align-items: center; justify-content: center;
    }
    .logo img { width: 22px; height: 22px; display: block; }
    .title { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .subtitle { font-size: 10.5px; color: #8a8a8a; font-family: 'SF Mono', monospace; margin-top: 2px; }

    .section { padding: 18px; }

    /* signed-out hero */
    .hero h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 12.5px;
      color: #6b6b6b;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 11px 14px;
      border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: #117dff; color: white;
      box-shadow: 0 1px 2px rgba(17,125,255,0.25);
    }
    .btn-primary:hover { background: #0066e0; }
    .btn-primary:disabled { background: #b7d4ff; cursor: wait; }
    .btn-ghost {
      background: white; color: #0a0a0a;
      border: 1px solid #ece9e2;
    }
    .btn-ghost:hover { background: #f3f1ec; }
    .btn-text {
      background: transparent; color: #8a8a8a;
      font-size: 11.5px; font-weight: 500;
      padding: 8px;
    }
    .btn-text:hover { color: #0a0a0a; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      font-size: 11px; color: #16a34a;
      font-weight: 600;
    }
    .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    .profile {
      display: flex; align-items: center; gap: 10px;
      padding: 12px;
      background: white;
      border: 1px solid #ece9e2;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #117dff, #0066e0);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 14px;
    }
    .profile-meta { flex: 1; min-width: 0; }
    .profile-email {
      font-size: 12.5px; font-weight: 600; color: #0a0a0a;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-org { font-size: 10.5px; color: #8a8a8a; margin-top: 2px; }

    .stats { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat {
      flex: 1; padding: 10px;
      background: white;
      border: 1px solid #ece9e2;
      border-radius: 10px;
      text-align: center;
    }
    .stat-value { font-size: 18px; font-weight: 700; color: #117dff; letter-spacing: -0.02em; }
    .stat-label {
      font-size: 9.5px; color: #8a8a8a; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;
    }

    .err {
      padding: 10px 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 10px;
    }

    .eu-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 8px; border-radius: 6px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      font-size: 9.5px; color: #16a34a; font-weight: 600;
      margin-top: 14px;
    }

    .footer {
      padding: 12px 18px;
      border-top: 1px solid #ece9e2;
      text-align: center;
    }
    .footer a {
      color: #117dff; text-decoration: none;
      font-size: 11px; font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="Hivemind_extension.png" alt="HIVE" /></div>
    <div>
      <div class="title">HIVEMIND</div>
      <div class="subtitle">persistent memory · mcp ready</div>
    </div>
  </div>

  <!-- Signed-out -->
  <div id="signedOut" class="section hero hidden">
    <h2>Talk to HIVE</h2>
    <p>Sign in with your browser to chat with your memory engine. Same flow as the CLI — no API key needed.</p>
    <button id="signInBtn" class="btn btn-primary">
      Sign in with browser
    </button>
    <div id="signInErr" class="err hidden"></div>
    <div class="eu-badge">🇪🇺 EU Sovereign — Frankfurt</div>
  </div>

  <!-- Signed-in -->
  <div id="signedIn" class="section hidden">
    <div class="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-meta">
        <div class="profile-email" id="email">—</div>
        <div class="profile-org">
          <span class="status-pill"><span class="dot"></span>Connected</span>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="memoryCount">—</div>
        <div class="stat-label">Memories</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="obsCount">—</div>
        <div class="stat-label">Observations</div>
      </div>
    </div>

    <button id="openChatBtn" class="btn btn-primary">
      💬 Open Talk to HIVE
    </button>
    <button id="signOutBtn" class="btn btn-text" style="margin-top:6px;">
      Sign out
    </button>
  </div>

  <div class="footer">
    <a href="https://hivemind.davinciai.eu" target="_blank">hivemind.davinciai.eu</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
