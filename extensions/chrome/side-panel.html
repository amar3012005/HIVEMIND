<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk to HIVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #faf9f4;
      --surface: #ffffff;
      --border: #ece9e2;
      --text: #0a0a0a;
      --muted: #8a8a8a;
      --primary: #117dff;
      --user-bg: #117dff;
      --user-text: #ffffff;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────── */
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    .topbar .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 13px;
      letter-spacing: -0.01em;
    }
    .brand-icon {
      width: 24px; height: 24px; border-radius: 7px;
      background: rgba(17,125,255,0.08);
      border: 1px solid rgba(17,125,255,0.18);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon img { width: 14px; height: 14px; }
    .topbar .user {
      margin-left: auto;
      font-size: 11px; color: var(--muted);
      font-family: 'SF Mono', monospace;
    }
    .topbar .icon-btn {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); padding: 4px;
      border-radius: 6px;
    }
    .topbar .icon-btn:hover { background: rgba(0,0,0,0.04); color: var(--text); }

    /* ── Messages area ─────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #d4d0ca; border-radius: 3px; }

    /* signed-out / empty hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px 24px;
      text-align: center;
    }
    .hero-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .hero-sub { font-size: 13px; color: var(--muted); line-height: 1.55; max-width: 280px; }
    .hero-btn {
      margin-top: 8px;
      background: var(--primary); color: white;
      border: none; padding: 11px 20px;
      border-radius: 10px; font-weight: 600;
      cursor: pointer; font-size: 13px;
      box-shadow: 0 2px 8px rgba(17,125,255,0.25);
    }
    .hero-btn:hover { background: #0066e0; }

    /* user bubble (right) */
    .msg-user {
      align-self: flex-end;
      max-width: 80%;
    }
    .bubble-user {
      background: var(--user-bg);
      color: var(--user-text);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(17,125,255,0.18);
    }

    /* assistant card (left) */
    .msg-ai { align-self: flex-start; max-width: 92%; width: 100%; }
    .ai-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .ai-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(17,125,255,0.1);
      border: 1px solid rgba(17,125,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .ai-avatar img { width: 12px; height: 12px; }
    .ai-name { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
    .ai-model { font-size: 10.5px; color: var(--muted); font-family: 'SF Mono', monospace; }
    .ai-dot { color: #d4d0ca; }

    .ai-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .ai-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .ai-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 10px -16px 8px;
    }
    .ai-meta {
      display: flex; align-items: center; gap: 10px;
      flex-wrap: wrap;
      font-size: 10.5px;
      color: var(--muted);
      font-family: 'SF Mono', monospace;
    }
    .sources-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
      color: var(--muted);
      font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .sources-toggle:hover { color: var(--text); }
    .tok-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .tok-dot.blue { background: #93c5fd; }
    .tok-dot.green { background: #86efac; }

    .sources-list {
      margin-top: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .source-item {
      font-size: 11px;
      padding: 6px 8px;
      background: #f7f6f1;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #525252;
    }
    .source-title { font-weight: 600; color: var(--text); }

    /* steps timeline */
    .steps-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted);
      cursor: pointer; user-select: none;
      padding: 4px 10px; background: #f7f6f1;
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .steps-toggle:hover { color: var(--text); background: #efece5; }
    .steps-toggle[data-open="1"] .steps-caret { transform: rotate(90deg); }
    .steps-caret { transition: transform 0.2s; display: inline-block; }
    .steps-list {
      display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #fafaf6;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .step-item {
      font-size: 11px;
      color: #525252;
      display: flex; gap: 6px;
      align-items: baseline;
      flex-wrap: wrap;
      font-family: 'SF Mono', monospace;
    }
    .step-item code {
      background: rgba(17,125,255,0.08);
      color: #0066e0;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10.5px;
    }
    .step-args { color: var(--muted); font-style: italic; }
    .step-status { color: #16a34a; margin-left: auto; }

    /* thinking */
    .thinking {
      display: inline-flex; gap: 4px; align-items: center;
      padding: 6px 0;
    }
    .thinking .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #c0bcb4;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking .dot:nth-child(2) { animation-delay: 0.15s; }
    .thinking .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .err-msg {
      align-self: center;
      font-size: 12px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px 12px;
      border-radius: 8px;
    }

    /* context pill + toolbar */
    .ctx-toolbar {
      display: flex; gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .ctx-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #525252;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .ctx-btn:hover { border-color: #c0d8ff; color: var(--primary); }
    .ctx-btn.active {
      background: rgba(17,125,255,0.08);
      border-color: rgba(17,125,255,0.3);
      color: var(--primary);
    }
    .ctx-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: rgba(17,125,255,0.06);
      border: 1px solid rgba(17,125,255,0.2);
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .ctx-icon { flex-shrink: 0; }
    .ctx-label {
      flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; color: var(--text);
    }
    .ctx-meta { font-size: 10.5px; color: var(--muted); font-family: 'SF Mono', monospace; }
    .ctx-clear {
      background: transparent; border: none; cursor: pointer;
      color: var(--muted); font-size: 14px;
      padding: 0 4px; line-height: 1;
    }
    .ctx-clear:hover { color: var(--text); }

    /* ── Composer ───────────── */
    .composer {
      flex-shrink: 0;
      padding: 12px 16px 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .composer-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 6px 6px 6px 16px;
      transition: border-color 0.15s;
    }
    .composer-row:focus-within { border-color: #c0d8ff; }
    .composer textarea {
      flex: 1;
      border: none; outline: none; resize: none;
      background: transparent;
      font: inherit; font-size: 14px;
      color: var(--text);
      max-height: 120px;
      min-height: 24px;
      padding: 6px 0;
      line-height: 1.4;
      font-family: inherit;
    }
    .composer textarea::placeholder { color: #c0bcb4; }
    .send-btn {
      width: 32px; height: 32px;
      border: none; cursor: pointer;
      border-radius: 50%;
      background: rgba(17,125,255,0.12);
      color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .send-btn:hover { background: rgba(17,125,255,0.2); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    .hint {
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 8px;
      font-family: 'SF Mono', monospace;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><img src="Hivemind_extension.png" alt="" /></div>
      Talk to HIVE
    </div>
    <span class="user" id="userPill"></span>
    <button class="icon-btn" id="newChatBtn" title="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </div>

  <!-- Signed-out hero -->
  <div id="hero" class="hero hidden">
    <div class="brand-icon" style="width:48px;height:48px;border-radius:14px;">
      <img src="Hivemind_extension.png" style="width:28px;height:28px;" />
    </div>
    <div class="hero-title">Talk to HIVE</div>
    <div class="hero-sub">Sign in with your browser to chat with your persistent memory engine.</div>
    <button id="heroSignIn" class="hero-btn">Sign in with browser</button>
  </div>

  <!-- Chat messages -->
  <div id="messages" class="messages hidden"></div>

  <!-- Composer -->
  <div id="composer" class="composer hidden">
    <!-- context pill (selection or section) -->
    <div id="ctxPill" class="ctx-pill hidden">
      <span class="ctx-icon">📌</span>
      <span class="ctx-label" id="ctxLabel"></span>
      <span class="ctx-meta" id="ctxMeta"></span>
      <button class="ctx-clear" id="ctxClear" title="Remove context">✕</button>
    </div>

    <!-- context toolbar -->
    <div class="ctx-toolbar">
      <button id="selBtn" class="ctx-btn" title="Use current text selection on page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        Selection
      </button>
      <button id="sectionBtn" class="ctx-btn" title="Pick a section on the page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Section
      </button>
      <button id="pageBtn" class="ctx-btn" title="Send whole page as context">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Page
      </button>
    </div>

    <div class="composer-row">
      <textarea id="input" rows="1" placeholder="Ask HIVE anything…"></textarea>
      <button id="sendBtn" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for newline · Esc to close</div>
  </div>

  <script src="side-panel.js"></script>
</body>
</html>
