[project]
name = "hm-understand"
version = "0.1.0"
description = "Evidence-linked multilingual extraction service for HIVE-MIND"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.4",
  "gliner==0.2.21",
  "torch==2.5.1",
  "huggingface-hub==0.31.2",
  "langid==1.1.6",
  "python-dateutil==2.9.0.post0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
