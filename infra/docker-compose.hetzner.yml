# HIVEMIND — portable single-box stack (fresh Hetzner / any Docker host).
# Distilled from the live Coolify deployment (docker-compose.coolify.yml) into a Coolify-independent
# compose: clone the repo, fill .env, `docker compose -f infra/docker-compose.hetzner.yml up -d`.
# Internal DNS (postgres/qdrant/redis/nango/docling) — no host ports needed except the public edge.
#
# .amr (mneme) memory engine: per-org storage backend selected by MNEME_ORGS. The .amr files live on
# the host-persisted `hivemind-data` volume at /app/data/mneme — BACK THIS UP (it is the sole copy for
# an .amr org). See infra/HETZNER.md.

name: hivemind

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-hivemind_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hivemind}?schema=hivemind&connection_limit=20&pool_timeout=30
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  EMBEDDING_DIMENSION: "1024"
  # ── .amr memory engine ──
  MNEME_ORGS: ${MNEME_ORGS:-}                       # "" none | "<orgId>" | "a,b" | "*" all
  MNEME_DATA_ROOT: ${MNEME_DATA_ROOT:-/app/data/mneme}
  MNEME_BINDING: ${MNEME_BINDING:-/app/src/vector/mneme/singulance-amr.linux-x64-gnu.node}
  # BYOD: per-org remote agents. Inert until an agent enrolls (file empty). Shared with the broker.
  MNEME_AGENT_REGISTRY_FILE: ${MNEME_AGENT_REGISTRY_FILE:-/app/data/byod-agents.json}
  # ── model providers (egress) ──
  GROQ_API_KEY: ${GROQ_API_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Opt-in Cloudflare AI Gateway for text chat. Disable the flag to roll back
  # to direct providers; enabled Gateway requests do not silently double-call.
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
  CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
  CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
  # Name only, without dynamic/. Example: core-text.
  CLOUDFLARE_AI_GATEWAY_TEXT_ROUTE: ${CLOUDFLARE_AI_GATEWAY_TEXT_ROUTE:-}
  CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS:-}
  CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
  CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS:-}
  CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS:-}
  CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS:-}
  CLOUDFLARE_AI_GATEWAY_BLAIQ_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_BLAIQ_BYOK_ALIAS:-}
  # ── auth / secrets ──
  HIVEMIND_MASTER_API_KEY: ${HIVEMIND_MASTER_API_KEY}
  SESSION_SECRET: ${SESSION_SECRET}
  HIVEMIND_ADMIN_SECRET: ${HIVEMIND_ADMIN_SECRET}
  HIVEMIND_PLATFORM_ADMIN_PASSCODE: ${HIVEMIND_PLATFORM_ADMIN_PASSCODE}
  # ── CORS: FE origins allowed to call the engine (comma-separated) ──
  HIVEMIND_ALLOWED_ORIGINS: ${HIVEMIND_ALLOWED_ORIGINS:-}
  # ── Google OAuth (login) ──
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET:-}}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}

services:
  core:
    build: { context: .., dockerfile: Dockerfile.production }
    image: hivemind/core-api:${VERSION:-latest}
    container_name: hm-core
    env_file: [../.env]
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
    environment:
      <<: *common-env
      HOSTNAME: hm-core
      DOCLING_URL: http://docling:5001
      # Container-to-container traffic must use Nango's listening port (8080).
      # NANGO_URL in the host .env is the public/host-bound endpoint and is not
      # reliably reachable from Core through the host firewall/NAT path.
      NANGO_URL: http://nango:8080
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_PUBLIC_URL: ${NANGO_PUBLIC_URL:-http://nango:3003}
      HYPERAGENTS_RUNTIME_CONNECTORS: ${HYPERAGENTS_RUNTIME_CONNECTORS:-nango}
      # Keep the Core-to-browser service credential explicit. `env_file` also
      # supplies it today, but Core must retain this dependency if env loading
      # is narrowed in a later production compose change.
      PLAYWRIGHT_SERVICE_TOKEN: ${PLAYWRIGHT_SERVICE_TOKEN:?PLAYWRIGHT_SERVICE_TOKEN is required}
    volumes:
      - hivemind-data:/app/data        # ← .amr files live here; BACK UP
      - hivemind-logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      qdrant:   { condition: service_started }
      redis:    { condition: service_started }
    ports:
      - "127.0.0.1:${CORE_PORT:-2026}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  control-plane:
    build: { context: .., dockerfile: Dockerfile.control-plane }
    image: hivemind/control-plane:${VERSION:-latest}
    container_name: hm-control
    env_file: [../.env]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1152m
    cpus: 0.75
    environment:
      <<: *common-env
      HIVEMIND_CORE_API_BASE_URL: http://core:3000
      HYPERAGENTS_RUNTIME_CONNECTORS: ${HYPERAGENTS_RUNTIME_CONNECTORS:-nango}
      # Company onboarding is latency-sensitive and Groq is currently failing
      # over on this host. Prefer OpenRouter here; groqFetch still falls back.
      LLM_PRIMARY: ${CONTROL_LLM_PRIMARY:-openrouter}
    volumes:
      - hivemind-data:/app/data        # share the BYOD registry file with core (selfhost/register writes it)
    depends_on:
      postgres: { condition: service_healthy }
      core:     { condition: service_started }
    ports:
      - "127.0.0.1:${CONTROL_PORT:-2027}:3000"

  employees:
    build: { context: ../employees-service }
    image: hivemind/employees:${VERSION:-latest}
    container_name: hm-employees
    env_file: [../.env]
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 0.75
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hivemind_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hivemind}?schema=hivemind
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      HIVEMIND_CORE_API_BASE_URL: http://core:3000
      HYPERAGENTS_RUNTIME_CONNECTORS: ${HYPERAGENTS_RUNTIME_CONNECTORS:-nango}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_GROQ_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CEREBRAS_BYOK_ALIAS:-}
      HYPER_SYNTH_MODEL: ${HYPER_SYNTH_MODEL:-openai/gpt-oss-20b:nitro}
      VISUAL_PATH_IN_HYPERROOMS: ${VISUAL_PATH_IN_HYPERROOMS:-true}
      CLAUDE_ADS_RESOURCE_ROOT: /opt/hivemind-resources/claude-ads
      # Employees sidecar MUST listen on 8060 — control-plane calls http://hm-employees:8060
      # (control-plane-server.js _hyperSidecar default). The global .env sets PORT=3000 (for core), so
      # override it here or the sidecar binds 3000 and every room turn "no responses". config.py
      # already defaults port=8060; this just neutralizes the inherited global PORT=3000.
      PORT: "8060"
    volumes:
      - ../resources/claude-ads:/opt/hivemind-resources/claude-ads:ro
    depends_on:
      postgres: { condition: service_healthy }
      core:     { condition: service_started }

  postgres:
    build: { context: ./postgres, dockerfile: Dockerfile.age }   # Postgres 15 + Apache AGE
    image: hivemind/postgres-age:15-age-custom
    container_name: hm-postgres
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hivemind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
    command:
      - postgres
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-300s}
      - -c
      - archive_command=hivemind-pgbackrest --stanza=hivemind archive-push %p
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-pitr-repo:/var/lib/pgbackrest
      - postgres-pitr-secrets:/run/secrets/hivemind-pitr:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivemind_user} -d ${POSTGRES_DB:-hivemind}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: hm-qdrant
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.25
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    # Per-tenant collections each open many RocksDB segment files; default nofile=1024 → "Too many open
    # files" → new org_<id> collections fail to create (managed tenants then fall back to shared/in-mem).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: hm-redis
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 576m
    cpus: 0.25
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  nango:
    image: nangohq/nango-server:hosted
    container_name: hm-nango
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1152m
    cpus: 0.5
    environment:
      NANGO_DATABASE_URL: postgresql://${POSTGRES_USER:-hivemind_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hivemind}?schema=nango
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
      NANGO_SERVER_URL: ${NANGO_PUBLIC_URL:-http://nango:3003}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${NANGO_PORT:-3003}:8080"

  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: hm-docling
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.0
    volumes:
      - docling-models:/opt/app-root/src/.cache

  # hm-extract: stateless anydoc-based extraction, NARROW format scope only
  # (pptx/doc/docm/odt/rtf/epub — see hm-extract-adapter.js's
  # header for why xlsx/csv/docx/pdf are deliberately excluded). Internal
  # network only, no published port — core reaches it at KB_EXTRACT_URL.
  # Memory sized per hm-extract/README.md's real measurement: repeated
  # large-document passes plateau around ~5.3GB on QEMU-emulated amd64;
  # 4g here is a starting point for real x86 hardware, not yet re-verified
  # there — watch memory in production before raising traffic through it.
  hm-extract:
    build: { context: ../hm-extract }
    image: hivemind/hm-extract:${VERSION:-latest}
    container_name: hm-extract
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 5g
    cpus: 1.0
    environment:
      UV_THREADPOOL_SIZE: "8"
    # NO healthcheck override here — the Dockerfile's own HEALTHCHECK
    # (node -e "fetch(...)") is correct and already verified working.
    # A first version of this file overrode it with a `wget`-based check
    # copied from other services' conventions; node:22-slim has no wget,
    # so that override made a genuinely healthy, listening service report
    # unhealthy — caught on the real first production deploy attempt.

  # BYOD broker: validates a customer's API key → binds their hm-agent to their org by writing the
  # shared registry the core reads. Outbound enrollment only; reachable at /v1/byod/enroll. Optional —
  # only needed to OFFER BYOD. Shares the hivemind-data volume so core + broker see one registry file.
  byod-broker:
    build: { context: ../byod/broker }
    image: hivemind/byod-broker:${VERSION:-latest}
    container_name: hm-byod-broker
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.25
    environment:
      DATABASE_URL: ${BROKER_DATABASE_URL:?set BROKER_DATABASE_URL for the BYOD broker}
      MNEME_AGENT_REGISTRY_FILE: /app/data/byod-agents.json
      BROKER_PORT: "8790"
    volumes:
      - hivemind-data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${BROKER_PORT:-8790}:8790"

  # ── Voice agent (TARA) — Deepgram orchestration + managed telephony ──
  tara-deepgram:
    build: { context: ../services/tara-deepgram }
    image: hivemind/tara-deepgram:${VERSION:-latest}
    container_name: tara-deepgram
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1152m
    cpus: 0.75
    env_file:
      - ${TARA_DEEPGRAM_ENV_FILE:-/opt/tara-deepgram/.env}
    environment:
      HIVEMIND_API_KEY: ${HIVEMIND_MASTER_API_KEY}
      HIVEMIND_TARA_STREAM_URL: http://core:3000/api/tara/stream
      # Telephony carrier toggle — the sideline switch. zernio (Telnyx-backed)
      # replaces twilio, whose credentials 401'd. Overrides the value in
      # /opt/tara-deepgram/.env; set TELEPHONY_PROVIDER=telnyx|twilio to switch
      # back without a code change. Not a secret, so it lives in git.
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-zernio}
      # Strategist model pin. /opt/tara-deepgram/.env still holds the old
      # gemini-2.5-flash-lite; this git-tracked value overrides it so the whole
      # deepgram path runs Cerebras gpt-oss-120b. Not a secret, so it lives here
      # rather than in an untracked env file nobody can review.
      TARA_DG_ROUTER_MODEL: ${TARA_DG_ROUTER_MODEL:-openai/gpt-oss-120b}
      TARA_DG_ROUTER_PROVIDER: ${TARA_DG_ROUTER_PROVIDER:-Cerebras}
      TARA_DG_ROUTER_REASONING: ${TARA_DG_ROUTER_REASONING:-low}
      # AMD is OFF. Controlled A/B on one number with a stable baseline:
      # without AMD 38s/35s/35s/37s and the media bridge opened every time;
      # with AMD 6s and the bridge NEVER opened. Zernio's "defer the bridge
      # until human/machine is decided" drops these calls outright.
      ZERNIO_AMD: ${ZERNIO_AMD:-false}
      # Live-listen: core SIGNS a session-scoped token, this service VERIFIES it,
      # so the browser never holds the privileged dial key. Value from ../.env.
      TARA_DG_LISTEN_SECRET: ${TARA_DG_LISTEN_SECRET}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_GATEWAY_ENABLED: ${CLOUDFLARE_AI_GATEWAY_ENABLED:-false}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_OPENROUTER_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_DEEPGRAM_BYOK_ALIAS:-}
      CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS: ${CLOUDFLARE_AI_GATEWAY_CARTESIA_BYOK_ALIAS:-}
    ports:
      # Loopback-only: hm-caddy (network_mode: host) fronts this at /voice2.
      # Binding all interfaces would expose the voice adapter publicly — this
      # matches the hardened run-tree config that production actually uses.
      - "127.0.0.1:${TARA_DEEPGRAM_PORT:-8091}:8091"
    volumes:
      - /opt/tara-deepgram/call-logs:/data/call-logs
    depends_on:
      core: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Voice agent (TARA) — xAI Grok Voice, parallel to Deepgram ───────────
  tara-grok:
    build: { context: ../services/tara-grok }
    image: hivemind/tara-grok:${VERSION:-latest}
    container_name: tara-grok
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1152m
    cpus: 0.75
    env_file:
      - ${TARA_GROK_ENV_FILE:-/opt/tara-grok/.env}
    environment:
      HIVEMIND_CORE_EVENTS_URL: http://core:3000/internal/v1/tara/calls
      # Live-listen: verify Core-minted session-scoped tokens (same key core signs
      # with) so the dashboard can hear Grok PSTN calls without the dial key.
      TARA_DG_LISTEN_SECRET: ${TARA_DG_LISTEN_SECRET}
      # Dial gate — same shared secret + `x-tara-key` contract as tara-deepgram.
      # NOTE: the destination allowlist deliberately is NOT set here. Compose
      # `environment` OVERRIDES env_file, so listing it would blank the value from
      # /opt/tara-grok/.env and fail-closed every dial.
      TARA_DG_API_KEY: ${TARA_DG_API_KEY:-}
    ports:
      - "127.0.0.1:${TARA_GROK_PORT:-8092}:8092"
    depends_on:
      core: { condition: service_healthy }
    read_only: true
    tmpfs: [ /tmp ]
    security_opt: [ "no-new-privileges:true" ]
    cap_drop: [ ALL ]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Hermes (agent gateway) — buildable from services/hm-hermes ──
  hermes:
    build: { context: ../services/hm-hermes }
    image: hivemind/hm-hermes:${VERSION:-latest}
    container_name: hm-hermes
    restart: unless-stopped
    environment:
      HIVEMIND_CORE_API_BASE_URL: http://core:3000
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      HERMES_MGMT_KEY: ${HERMES_MGMT_KEY:-}
    depends_on: [core]
    profiles: ["full"]

  # ── Playwright (browser automation: connector scrape + HyperAgents onboarding
  #    homepage screenshots) — part of the default managed stack so a plain
  #    `compose up -d` keeps it running (no --profile gate). ──
  playwright:
    build: { context: ../services/hm-playwright }
    image: hivemind/hm-playwright:${VERSION:-latest}
    container_name: hm-playwright
    restart: unless-stopped
    mem_limit: 2560m
    memswap_limit: 3328m
    cpus: 1.5
    environment:
      PLAYWRIGHT_SERVICE_TOKEN: ${PLAYWRIGHT_SERVICE_TOKEN:?PLAYWRIGHT_SERVICE_TOKEN is required}
      PLAYWRIGHT_SESSIONS_DIR: /app/sessions
      PLAYWRIGHT_CRAWL_CONCURRENCY: "4"
    volumes:
      # Captured storageState files are credentials: host-managed, never baked
      # into an image, and mounted read-only into the browser service.
      - /root/hivemind/services/hm-playwright/sessions:/app/sessions:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8932/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── NOT in this repo: stt-eu (speech-to-text :8002) + csi (CSI-Engine, separate build). Push their
  #    images + add a service block here if you need voice STT / CSI. Core + tara + hermes run without them.

volumes:
  hivemind-data:     # .amr files + uploads — SOLE COPY for .amr orgs; back up
  hivemind-logs:
  postgres-data:
  postgres-pitr-repo:    # encrypted pgBackRest base backups + continuous WAL archive
  postgres-pitr-secrets: # repository cipher pass; mounted only into PostgreSQL
  qdrant-data:
  redis-data:
  docling-models:
