# Named-tunnel ingress for the HIVE chat local origin.
# Credentials stay on the host and are mounted at runtime. Do not commit them.
# The browser stays on next.preview; the private Harness origin is transport only.

tunnel: 56892994-584d-4ca7-8470-0b98de10c7fc
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: preview-api.singulancelabs.com
    service: http://origin-gateway:80
  - hostname: preview.singulancelabs.com
    service: http://origin-gateway:80
  - hostname: harness-preview.singulancelabs.com
    service: http://origin-gateway:80
  - hostname: nango-preview.singulancelabs.com
    service: http://origin-gateway:80
  - service: http_status:404
