[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hivemind-sdk"
version = "0.1.0"
description = "Official Python SDK for HIVEMIND — EU-sovereign company brain. Plug into any LLM stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "HIVEMIND", email = "support@hivemind.davinciai.eu" }
]
keywords = [
  "ai", "memory", "rag", "llm", "knowledge-graph",
  "langchain", "llamaindex", "openai", "anthropic", "claude"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.5.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
openai = ["openai>=1.30.0"]
anthropic = ["anthropic>=0.30.0"]
all = [
  "langchain-core>=0.2.0",
  "llama-index-core>=0.10.0",
  "openai>=1.30.0",
  "anthropic>=0.30.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://hivemind.davinciai.eu"
Documentation = "https://hivemind.davinciai.eu/docs"
Repository = "https://github.com/amar3012005/HIVEMIND"
Issues = "https://github.com/amar3012005/HIVEMIND/issues"

[tool.hatch.build.targets.wheel]
packages = ["hivemind"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
